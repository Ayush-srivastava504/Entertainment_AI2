# Runs the crawlers on GitHub's servers so you don't have to run them by hand.
# Add these under the repo's Settings -> Secrets and variables -> Actions:
#   DATABASE_URL, TMDB_API_READ_ACCESS_TOKEN, GEMINI_API_KEY, INDEXNOW_KEY (optional)
# DATABASE_URL must be IPv4-reachable: GitHub runners have no IPv6. On
# Supabase use the "Session pooler" string, not the "Direct connection".
# You can also run any job manually from the Actions tab ("Run workflow").
name: Crawl and generate

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC: refresh catalog data
    - cron: "0 5 * * *"   # daily at 05:00 UTC: write new guides
    - cron: "0 13 * * *"  # second pass: retries titles the model was too busy for
    - cron: "0 21 * * *"  # third pass
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        default: both
        options: [both, crawl, generate]
      limit:
        description: "Max guides to generate per table"
        default: "20"

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.job != 'generate' ||
      github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run crawl:all

  generate:
    if: >
      github.event_name == 'workflow_dispatch' && inputs.job != 'crawl' ||
      github.event_name == 'schedule' && github.event.schedule != '0 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      NEXT_PUBLIC_SITE_URL: https://marquees.site
      # Tried in order; a busy model (503) falls through to the next one.
      GEMINI_MODEL: gemini-2.5-flash
      GEMINI_FALLBACK_MODELS: gemini-2.5-flash-lite,gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate ending-explained guides
        run: node crawler/ending-explained-generator.mjs --limit=${{ inputs.limit || 20 }}
      - name: Discover franchises and write Watch Order guides
        if: always()
        run: node crawler/watch-order-auto.mjs --limit=10
