# Runs the crawlers on GitHub's servers so you don't have to run them by hand.
# Add these under the repo's Settings -> Secrets and variables -> Actions:
#   DATABASE_URL, TMDB_API_READ_ACCESS_TOKEN, GEMINI_API_KEY, INDEXNOW_KEY (optional)
# DATABASE_URL must be IPv4-reachable: GitHub runners have no IPv6. On
# Supabase use the "Session pooler" string, not the "Direct connection".
# You can also run any job manually from the Actions tab ("Run workflow").
name: Crawl and generate

# Runs every 9 days, not daily. New pages need time to be crawled and earn
# trust; publishing a big batch of URLs every day looks like spam to search
# engines. GitHub cron can't say "every 9 days", so these fire daily and the
# `gate` job below lets them through only when (days since 1970-01-01) % 9 == 0.
# Manual runs from the Actions tab always go through.
on:
  schedule:
    - cron: "0 3 * * *"   # run day 03:00 UTC: refresh catalog data
    - cron: "0 5 * * *"   # run day 05:00 UTC: write new guides
    - cron: "0 13 * * *"  # run day second pass: retries titles the model was too busy for
    - cron: "30 22 * * *" # run day: push everything new/changed today to Bing (IndexNow)
  workflow_dispatch:
    inputs:
      job:
        description: "What to run"
        type: choice
        default: both
        options: [both, crawl, generate, indexnow]
      limit:
        description: "Max guides to generate per table"
        default: "15"

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          day=$(( $(date -u +%s) / 86400 ))
          if [ "${{ github.event_name }}" != "schedule" ] || [ $(( day % 9 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Not a run day ($(( 9 - day % 9 )) day(s) until the next one). Skipping."
          fi

  crawl:
    needs: gate
    if: >
      needs.gate.outputs.run == 'true' && (
      github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'crawl') ||
      github.event_name == 'schedule' && github.event.schedule == '0 3 * * *' )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      # The watch-providers step pings IndexNow when a guide's streaming info changes.
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      NEXT_PUBLIC_SITE_URL: https://animegirl4u.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run crawl:all

  generate:
    needs: gate
    if: >
      needs.gate.outputs.run == 'true' && (
      github.event_name == 'workflow_dispatch' && (inputs.job == 'both' || inputs.job == 'generate') ||
      github.event_name == 'schedule' && github.event.schedule != '0 3 * * *' && github.event.schedule != '30 22 * * *' )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TMDB_API_READ_ACCESS_TOKEN: ${{ secrets.TMDB_API_READ_ACCESS_TOKEN }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      NEXT_PUBLIC_SITE_URL: https://animegirl4u.com
      # Tried in order; a busy model (503) falls through to the next one.
      GEMINI_MODEL: gemini-3.8-flash
      GEMINI_FALLBACK_MODELS: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate ending-explained guides
        run: node crawler/ending-explained-generator.mjs --limit=${{ inputs.limit || 15 }}
      - name: Discover franchises and write Watch Order guides
        if: always()
        run: node crawler/watch-order-auto.mjs --limit=10

  # Reads the live sitemaps and pushes every URL whose <lastmod> changed in the
  # last 36h to IndexNow (Bing, Yandex, Seznam, Naver). Safety net on top of the
  # per-run pings above; needs INDEXNOW_KEY set on Vercel too (the key file).
  indexnow:
    needs: gate
    if: >
      needs.gate.outputs.run == 'true' && (
      github.event_name == 'workflow_dispatch' && inputs.job == 'indexnow' ||
      github.event_name == 'schedule' && github.event.schedule == '30 22 * * *' )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      NEXT_PUBLIC_SITE_URL: https://animegirl4u.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node crawler/indexnow-bulk.mjs --since-hours=36
