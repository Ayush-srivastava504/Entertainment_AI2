<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline | Animegirl4u</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
    background:#2A3FF0;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center}
  .card{max-width:360px;background:#fff;color:#16163a;border:3px solid #16163a;border-radius:24px;
    padding:32px 24px;box-shadow:6px 6px 0 #FFD84A}
  .emoji{font-size:56px}
  h1{margin:12px 0 8px;font-size:24px}
  p{margin:0 0 20px;color:#555;line-height:1.5}
  button{background:#2A3FF0;color:#fff;border:0;border-radius:999px;padding:12px 28px;font-size:16px;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">📡</div>
    <h1>You are offline</h1>
    <p>Animegirl4u needs an internet connection. Check your Wi-Fi or mobile data and try again.</p>
    <button id="retry" type="button">Try again</button>
  </div>
  <script>
    function go(){ window.location.href = "https://animegirl4u.com/"; }
    document.getElementById("retry").addEventListener("click", go);
    window.addEventListener("online", go);
  </script>
</body>
</html>
